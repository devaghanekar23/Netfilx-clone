apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: movie-app-hpa
  namespace: movie-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: movie-app

  minReplicas: 2
  maxReplicas: 5

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
